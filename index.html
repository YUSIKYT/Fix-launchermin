<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIX Launcher - Официальный сайт</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --primary: #ff4646;
            --primary-hover: #ff6161;
            --bg: #050505;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            scroll-behavior: smooth;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 70, 70, 0.12) 0%, transparent 40%);
            z-index: -1;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-premium {
            background: var(--primary);
            box-shadow: 0 10px 40px -10px rgba(255, 70, 70, 0.5);
            transition: all 0.4s ease;
        }

        .btn-premium:hover {
            transform: translateY(-5px);
            background: var(--primary-hover);
        }

        .comment-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .screenshot-frame {
            position: relative;
            border-radius: 30px;
            padding: 10px;
            background: linear-gradient(135deg, rgba(255,70,70,0.3), rgba(255,255,255,0.05));
            box-shadow: 0 60px 120px -20px rgba(0,0,0,1);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    <div class="bg-glow" id="glow"></div>

    <nav class="w-full max-w-7xl px-8 py-6 flex justify-between items-center z-50">
        <div class="glass px-6 py-3 rounded-2xl">
            <span class="text-xl font-black tracking-tighter uppercase">FIX <span class="text-red-500">LAUNCHER</span></span>
        </div>
        <div id="auth-status" class="flex items-center gap-4">
            <!-- Сюда подставится инфо о пользователе -->
        </div>
    </nav>

    <main class="flex flex-col items-center text-center px-4 pt-16 pb-20 w-full max-w-6xl">
        <h1 class="text-6xl md:text-[8rem] font-black mb-10 tracking-tighter uppercase leading-[0.85]">
            ИГРАЙ С <span class="text-red-500">FIX</span>
        </h1>
        
        <div class="w-full max-w-4xl mb-24 px-4">
            <div class="screenshot-frame">
                <img src="./Photo1.png" alt="FIX Launcher Interface" class="rounded-[22px] w-full h-auto block" onerror="this.src='https://via.placeholder.com/1200x675/111/ff4646?text=Photo1.png+Not+Found'">
            </div>
        </div>

        <a href="FIX-launcher.zip" download class="btn-premium px-16 py-6 rounded-2xl text-xl font-black uppercase tracking-widest">
            СКАЧАТЬ FIX-launcher.zip
        </a>
    </main>

    <section id="comments" class="w-full max-w-2xl px-8 pb-32">
        <div class="flex flex-col gap-10">
            <div class="text-center">
                <h2 class="text-3xl font-black uppercase mb-2">Отзывы игроков</h2>
            </div>

            <div id="comment-form-container">
                <div class="glass p-8 rounded-3xl text-center">
                    <p class="opacity-60 mb-6 uppercase text-xs font-bold tracking-widest">Войдите, чтобы оставить отзыв</p>
                    <button id="login-google-btn" onclick="loginGoogle()" class="btn-premium px-8 py-4 rounded-xl text-xs font-black uppercase tracking-widest">
                        Войти через Google
                    </button>
                    <p id="auth-error-msg" class="text-red-500 text-[10px] mt-4 uppercase hidden"></p>
                </div>
            </div>

            <div id="commentsList" class="flex flex-col gap-4">
                <div class="text-center py-10 opacity-20 font-bold uppercase text-xs">Загрузка отзывов...</div>
            </div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIoLNV7cBd_EIaAy1HuOQ9T1AdwzEWt_I",
            authDomain: "fixlaunchersite.firebaseapp.com",
            projectId: "fixlaunchersite",
            storageBucket: "fixlaunchersite.firebasestorage.app",
            messagingSenderId: "887919150293",
            appId: "1:887919150293:web:87d587bc14555dc42fce5c",
            measurementId: "G-LFTC3SMKW4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        const authStatus = document.getElementById('auth-status');
        const formContainer = document.getElementById('comment-form-container');

        // Гарантируем сохранение сессии в локальном хранилище
        setPersistence(auth, browserLocalPersistence);

        // Обработка RedirectResult (на случай если сработал Redirect)
        getRedirectResult(auth).then((result) => {
            if (result?.user) console.log("Вход через Redirect выполнен");
        }).catch(handleAuthError);

        function handleAuthError(error) {
            console.error("Ошибка авторизации:", error);
            const errorMsg = document.getElementById('auth-error-msg');
            if (errorMsg) {
                errorMsg.innerText = "Ошибка: " + (error.code === 'auth/popup-blocked' ? "Всплывающее окно заблокировано" : error.message);
                errorMsg.classList.remove('hidden');
            }
        }

        // Пытаемся сначала через Popup, если не выходит - через Redirect
        window.loginGoogle = async () => {
            const btn = document.getElementById('login-google-btn');
            if (btn) btn.innerText = "ВХОД...";
            
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/cancelled-popup-request') {
                    // Если попап заблокирован, пробуем редирект как запасной вариант
                    signInWithRedirect(auth, provider);
                } else {
                    handleAuthError(error);
                }
            } finally {
                if (btn) btn.innerText = "Войти через Google";
            }
        };

        window.logout = () => {
            signOut(auth).then(() => {
                window.location.reload();
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authStatus.innerHTML = `
                    <div class="flex items-center gap-3 glass px-4 py-2 rounded-xl">
                        <img src="${user.photoURL}" class="user-avatar" onerror="this.src='https://via.placeholder.com/32'">
                        <span class="text-[10px] font-bold uppercase opacity-70">${user.displayName}</span>
                        <button onclick="logout()" class="text-[10px] text-red-500 font-bold uppercase ml-2">Выйти</button>
                    </div>
                `;
                
                formContainer.innerHTML = `
                    <div class="glass p-8 rounded-3xl flex flex-col gap-4">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-[10px] font-bold opacity-40 uppercase">Пишете как:</span>
                            <span class="text-[10px] font-bold text-red-500 uppercase">${user.displayName}</span>
                        </div>
                        <textarea id="commentText" placeholder="Ваш отзыв..." rows="3" class="comment-input px-6 py-4 rounded-xl resize-none"></textarea>
                        <button onclick="sendComment()" id="submitBtn" class="btn-premium py-4 rounded-xl text-xs font-black uppercase tracking-widest">Отправить отзыв</button>
                    </div>
                `;
            } else {
                authStatus.innerHTML = '';
            }
            loadComments();
        });

        function loadComments() {
            const colRef = collection(db, 'reviews');
            onSnapshot(colRef, (snapshot) => {
                const list = document.getElementById('commentsList');
                if (!list) return;
                list.innerHTML = '';
                const docs = [];
                snapshot.forEach(d => docs.push(d.data()));
                docs.sort((a, b) => (b.time?.seconds || 0) - (a.time?.seconds || 0));
                
                if(docs.length === 0) {
                    list.innerHTML = '<div class="text-center opacity-20 text-xs uppercase font-bold">Отзывов пока нет</div>';
                    return;
                }
                
                docs.forEach(data => {
                    const div = document.createElement('div');
                    div.className = 'glass p-5 rounded-2xl border border-white/5 flex gap-4 items-start';
                    div.innerHTML = `
                        <img src="${data.photo || 'https://via.placeholder.com/32'}" class="user-avatar mt-1" onerror="this.src='https://via.placeholder.com/32'">
                        <div>
                            <div class="flex justify-between mb-1">
                                <span class="text-red-500 font-black text-[10px] uppercase">${data.name || 'Игрок'}</span>
                            </div>
                            <p class="text-sm opacity-70">${data.text || ''}</p>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        window.sendComment = async () => {
            const textInput = document.getElementById('commentText');
            const btn = document.getElementById('submitBtn');
            const user = auth.currentUser;

            if (!textInput || !textInput.value.trim() || !user) return;

            btn.disabled = true;
            btn.innerText = "ОТПРАВКА...";

            try {
                await addDoc(collection(db, 'reviews'), {
                    name: user.displayName,
                    photo: user.photoURL,
                    text: textInput.value.trim(),
                    time: serverTimestamp()
                });
                textInput.value = '';
                btn.innerText = "ГОТОВО!";
                setTimeout(() => { 
                    if (btn) {
                        btn.disabled = false; 
                        btn.innerText = "Отправить отзыв"; 
                    }
                }, 2000);
            } catch (e) {
                console.error(e);
                if (btn) {
                    btn.innerText = "ОШИБКА";
                    btn.disabled = false;
                }
            }
        };
    </script>

    <script>
        const glow = document.getElementById('glow');
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.setProperty('--mouse-x', x + '%');
            glow.style.setProperty('--mouse-y', y + '%');
        });
    </script>
</body>
</html>
