<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIX Launcher - Официальный сайт</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
        }

        .hero-gradient {
            background: radial-gradient(circle at center, rgba(255, 70, 70, 0.12) 0%, rgba(10, 10, 10, 1) 80%);
        }

        .floating {
            animation: floating 4s ease-in-out infinite;
        }

        @keyframes floating {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .btn-download {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #ff4646;
            box-shadow: 0 0 20px rgba(255, 70, 70, 0.4);
        }

        .btn-download:hover {
            transform: scale(1.05);
            background: #ff5f5f;
            box-shadow: 0 0 30px rgba(255, 70, 70, 0.6);
        }

        .text-glow {
            text-shadow: 0 0 20px rgba(255, 70, 70, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center hero-gradient">

    <!-- Навигация -->
    <nav class="w-full max-w-6xl px-8 py-6 flex justify-between items-center z-10">
        <div class="text-xl font-black tracking-tighter text-white flex items-center gap-2">
            <span class="bg-white text-black px-2 py-0.5 rounded">FIX</span> LAUNCHER
        </div>
        <div class="hidden md:flex gap-8 text-xs font-bold opacity-60 tracking-widest">
            <a href="#" class="hover:opacity-100 transition-opacity">ГЛАВНАЯ</a>
            <a href="#" class="hover:opacity-100 transition-opacity">ОСОБЕННОСТИ</a>
            <a href="#" class="hover:opacity-100 transition-opacity">ПОДДЕРЖКА</a>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="flex flex-col items-center text-center px-4 flex-grow justify-center -mt-10">
        <!-- Логотип (ONEPHOTO.png) -->
        <div class="relative mb-6">
            <img src="./ONEPHOTO.png" alt="FIX Launcher Logo" class="w-48 h-48 md:w-64 md:h-64 object-contain floating" onerror="this.classList.add('hidden')">
            <!-- Запасной вариант если картинка не грузится -->
            <div id="fallback-logo" class="hidden text-9xl font-black opacity-10 select-none">FIX</div>
        </div>

        <h1 class="text-5xl md:text-8xl font-black mb-6 tracking-tighter uppercase">
            ИГРАЙ С <span class="text-red-500 text-glow">FIX</span>
        </h1>
        
        <p class="text-sm md:text-base opacity-50 max-w-lg mb-10 leading-relaxed font-medium">
            Новое поколение лаунчера для Minecraft. Максимальная производительность, 
            удобный интерфейс и мгновенная установка модов.
        </p>

        <!-- Кнопка скачивания -->
        <a href="FIX-launcher.zip" download class="btn-download px-12 py-4 rounded-xl text-sm font-black flex items-center gap-3 tracking-widest uppercase">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
            СКАЧАТЬ FIX-launcher.zip
        </a>
    </main>

    <!-- Футер -->
    <footer class="w-full py-8 text-center text-[10px] opacity-20 uppercase tracking-[0.3em] font-bold">
        &copy; 2024 FIX LAUNCHER TEAM. ВСЕ ПРАВА ЗАЩИЩЕНЫ.
    </footer>

    <script>
        // Простая проверка: если картинка не загрузилась за 2 секунды, показываем текст
        const img = document.querySelector('img');
        img.onerror = function() {
            document.getElementById('fallback-logo').classList.remove('hidden');
            this.style.display = 'none';
        };
    </script>

</body>
</html>
