<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIX Launcher - Официальный сайт</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        :root {
            --primary: #ff4646;
            --primary-hover: #ff6161;
            --bg: #050505;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            overflow-x: hidden;
            margin: 0;
            scroll-behavior: smooth;
        }

        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 70, 70, 0.12) 0%, transparent 40%);
            z-index: -1;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-premium {
            background: var(--primary);
            box-shadow: 0 10px 40px -10px rgba(255, 70, 70, 0.5);
            transition: all 0.4s ease;
        }

        .btn-premium:hover {
            transform: translateY(-5px);
            background: var(--primary-hover);
        }

        .comment-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">
    <div class="bg-glow" id="glow"></div>

    <nav class="w-full max-w-7xl px-8 py-6 flex justify-between items-center z-50">
        <div class="glass px-6 py-3 rounded-2xl">
            <span class="text-xl font-black tracking-tighter uppercase">FIX <span class="text-red-500">LAUNCHER</span></span>
        </div>
        <div class="hidden md:flex gap-6 glass px-8 py-3 rounded-2xl text-[10px] font-bold opacity-70 tracking-widest uppercase">
            <a href="#" class="hover:text-red-500">ГЛАВНАЯ</a>
            <a href="#comments" class="hover:text-red-500">ОТЗЫВЫ</a>
        </div>
    </nav>

    <main class="flex flex-col items-center text-center px-4 pt-16 pb-20 w-full max-w-6xl">
        <h1 class="text-6xl md:text-[8rem] font-black mb-10 tracking-tighter uppercase leading-[0.85]">
            ИГРАЙ С <span class="text-red-500">FIX</span>
        </h1>
        <p class="text-base md:text-xl opacity-50 max-w-2xl mb-16">
            Новое поколение лаунчера для Minecraft. Максимальная производительность и удобство.
        </p>

        <a href="FIX-launcher.zip" download class="btn-premium px-16 py-6 rounded-2xl text-xl font-black uppercase tracking-widest">
            СКАЧАТЬ FIX-launcher.zip
        </a>
    </main>

    <section id="comments" class="w-full max-w-2xl px-8 pb-32">
        <div class="flex flex-col gap-10">
            <div class="text-center">
                <h2 class="text-3xl font-black uppercase mb-2">Отзывы игроков</h2>
                <p class="opacity-40 text-xs font-bold uppercase tracking-widest">Оставь свое мнение</p>
            </div>

            <div class="glass p-8 rounded-3xl flex flex-col gap-4">
                <input type="text" id="userName" placeholder="Твой ник" class="comment-input px-6 py-4 rounded-xl">
                <textarea id="commentText" placeholder="Сообщение..." rows="3" class="comment-input px-6 py-4 rounded-xl resize-none"></textarea>
                <button onclick="sendComment()" id="submitBtn" class="btn-premium py-4 rounded-xl text-xs font-black uppercase tracking-widest">Отправить</button>
            </div>

            <div id="commentsList" class="flex flex-col gap-4">
                <div class="text-center py-10 opacity-20 font-bold uppercase text-xs">Загрузка отзывов...</div>
            </div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // ТВОИ КЛЮЧИ (Обновлено на основе твоего скриншота)
        const firebaseConfig = {
            apiKey: "AIzaSyDIoLNV7cBd_EIaAy1HuOQ9T1AdwzEWt_I",
            authDomain: "fixlaunchersite.firebaseapp.com",
            projectId: "fixlaunchersite",
            storageBucket: "fixlaunchersite.firebasestorage.app",
            messagingSenderId: "887919150293",
            appId: "1:887919150293:web:87d587bc14555dc42fce5c",
            measurementId: "G-LFTC3SMKW4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUser = null;

        signInAnonymously(auth).catch(e => console.error("Auth failed:", e));
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) loadComments();
        });

        function loadComments() {
            const colRef = collection(db, 'reviews');
            onSnapshot(colRef, (snapshot) => {
                const list = document.getElementById('commentsList');
                list.innerHTML = '';
                const docs = [];
                snapshot.forEach(d => docs.push(d.data()));
                docs.sort((a, b) => (b.time?.seconds || 0) - (a.time?.seconds || 0));
                
                if(docs.length === 0) list.innerHTML = '<div class="text-center opacity-20 text-xs uppercase font-bold">Будь первым, кто оставит отзыв!</div>';
                
                docs.forEach(data => {
                    const div = document.createElement('div');
                    div.className = 'glass p-5 rounded-2xl border border-white/5';
                    div.innerHTML = `
                        <div class="flex justify-between mb-2">
                            <span class="text-red-500 font-black text-xs uppercase">${data.name}</span>
                        </div>
                        <p class="text-sm opacity-70">${data.text}</p>
                    `;
                    list.appendChild(div);
                });
            }, (error) => {
                console.error("Firestore Error:", error);
                document.getElementById('commentsList').innerHTML = '<div class="text-center text-red-500 text-xs uppercase font-bold">Ошибка доступа. Проверьте Rules в Firebase!</div>';
            });
        }

        window.sendComment = async () => {
            const nameInput = document.getElementById('userName');
            const textInput = document.getElementById('commentText');
            const btn = document.getElementById('submitBtn');

            if (!nameInput.value || !textInput.value || !currentUser) return;

            btn.disabled = true;
            btn.innerText = "ОТПРАВКА...";

            try {
                await addDoc(collection(db, 'reviews'), {
                    name: nameInput.value,
                    text: textInput.value,
                    time: serverTimestamp()
                });
                textInput.value = '';
                btn.innerText = "ГОТОВО!";
                setTimeout(() => { btn.disabled = false; btn.innerText = "ОТПРАВИТЬ"; }, 2000);
            } catch (e) {
                console.error(e);
                btn.innerText = "ОШИБКА";
                btn.disabled = false;
            }
        };
    </script>

    <script>
        const glow = document.getElementById('glow');
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.setProperty('--mouse-x', x + '%');
            glow.style.setProperty('--mouse-y', y + '%');
        });
    </script>
</body>
</html>
